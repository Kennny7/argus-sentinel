[project]
name = "argus-surveillance-recon"
version = "2.4.0"
description = "ARGUS Sentinel CCTV Target Tracking, Biometric Social Matching, 3D Facial Mesh Reconstruction & HITL Verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]
