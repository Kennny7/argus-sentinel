<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#070a0f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100" height="100" rx="18" fill="#070a0f" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Radar concentric circles -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="2,3" stroke-opacity="0.5"/>
  <circle cx="50" cy="50" r="26" fill="url(#centerGlow)" stroke="#00ff9d" stroke-width="1.5" stroke-opacity="0.8"/>
  <circle cx="50" cy="50" r="14" fill="#0b0f17" stroke="#00ff9d" stroke-width="2"/>
  <circle cx="50" cy="50" r="5" fill="#00ff9d"/>

  <!-- Crosshair Reticle -->
  <line x1="50" y1="4" x2="50" y2="20" stroke="#00ff9d" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="80" x2="50" y2="96" stroke="#00ff9d" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="50" x2="20" y2="50" stroke="#00ff9d" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="96" y2="50" stroke="#00ff9d" stroke-width="2" stroke-linecap="round"/>

  <!-- Corner Brackets (matching user HUD image) -->
  <path d="M 22 28 L 22 22 L 28 22" fill="none" stroke="#00ff9d" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M 78 28 L 78 22 L 72 22" fill="none" stroke="#00ff9d" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M 22 72 L 22 78 L 28 78" fill="none" stroke="#00ff9d" stroke-width="2.5" stroke-linecap="square"/>
  <path d="M 78 72 L 78 78 L 72 78" fill="none" stroke="#00ff9d" stroke-width="2.5" stroke-linecap="square"/>

  <!-- Tactical Hex Nodes -->
  <circle cx="28" cy="22" r="1.5" fill="#00e5ff"/>
  <circle cx="72" cy="22" r="1.5" fill="#00e5ff"/>
  <circle cx="28" cy="78" r="1.5" fill="#00e5ff"/>
  <circle cx="72" cy="78" r="1.5" fill="#00e5ff"/>
</svg>
